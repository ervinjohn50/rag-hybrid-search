[project]
name = "rag-hybrid-search"
version = "0.1.0"
description = "RAG API with hybrid retrieval (dense vectors, BM25, reranking) and cited answers from Claude Sonnet."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=2.6,<3",
    "fastapi>=0.162,<1",
    "fastembed>=0.9,<0.10",
    "pydantic-settings>=2.16,<3",
    "pypdf>=7,<8",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.20,<1.21",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
